<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wam Wam Utiti</title>
<style>
:root{
  --bg:#F1F7FC; --card:#FFFFFF; --ink:#1F3B57; --muted:#5B7388; --line:#C9DCEB;
  --accent:#E8863D; --accent-ink:#FFFFFF; --good:#2F8F46; --good-bg:#E3F5E8;
  --bad:#C4452F; --bad-bg:#FCE9E5; --sky:#DCEEFA;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10202E; --card:#18304A; --ink:#EAF3FB; --muted:#9DB6CB; --line:#2F4D6B;
    --accent:#F0974F; --accent-ink:#1B1208; --good:#6FD08A; --good-bg:#17402A;
    --bad:#FF9C86; --bad-bg:#4A2219; --sky:#1E3A55;
  }
}
:root[data-theme="dark"]{
  --bg:#10202E; --card:#18304A; --ink:#EAF3FB; --muted:#9DB6CB; --line:#2F4D6B;
  --accent:#F0974F; --accent-ink:#1B1208; --good:#6FD08A; --good-bg:#17402A;
  --bad:#FF9C86; --bad-bg:#4A2219; --sky:#1E3A55;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Avenir Next Rounded",ui-rounded,"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  font-size:19px;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:1.9rem;line-height:1.15;margin:6px 0 4px}
.sub{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s}
.count{font-size:.9rem;color:var(--muted);margin:6px 0 18px}
h2{font-size:1.25rem;margin:26px 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.story{display:flex;gap:16px;align-items:center}
.story p{margin:0;font-size:1.12rem;line-height:1.7}
.story svg{flex:0 0 150px;width:150px;height:150px;border-radius:14px}
.q{margin:14px 0}
.q .t{font-weight:700;margin:0 0 10px}
.choices{display:grid;gap:10px}
.choice{font:inherit;text-align:left;width:100%;min-height:52px;padding:12px 14px;border-radius:14px;
  border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.ok{background:var(--good-bg);border-color:var(--good);font-weight:700}
.choice.no{background:var(--bad-bg);border-color:var(--bad);opacity:.85}
.choice:disabled{cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
input[type=text]{font:inherit;font-size:1.3rem;width:130px;min-height:52px;padding:8px 12px;text-align:center;
  border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
button.go,button.again{font:inherit;font-weight:700;min-height:52px;padding:10px 22px;border-radius:14px;border:0;
  background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg{min-height:1.6em;margin:8px 0 0;font-weight:700}
.msg.ok{color:var(--good)} .msg.no{color:var(--bad)}
.hint{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.done{display:none;text-align:center;margin-top:26px;border-color:var(--accent)}
.done h2{margin-top:0}
.done.show{display:block}
.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile{font:inherit;text-align:left;min-height:84px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:center}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile:disabled{opacity:.55;cursor:default}
.tile b{display:block;font-size:1.05rem}.tile small{color:var(--muted)}
.tile .ic{font-size:2rem}
button.back{font:inherit;background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;padding:8px 0;min-height:44px}
.me{display:flex;align-items:center;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.me svg{width:52px;height:52px;flex:0 0 52px}.me b{font-size:1.1rem}
.stars{font-size:1.8rem;letter-spacing:4px;margin:0 0 8px;color:var(--accent)}
.tile.ch{flex-direction:column;justify-content:center;text-align:center;min-height:150px}.tile.ch svg{width:96px;height:96px}#whoList{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile small.st{color:var(--accent);font-size:1rem;letter-spacing:2px}
button.again.alt{background:var(--card);color:var(--ink);border:2px solid var(--accent)}
.story>div:first-child{flex:1}
.spk{font:inherit;min-height:44px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin-top:10px}
.spk.ico{min-width:48px;padding:6px 10px;margin:0;flex:0 0 auto}
.spk.on{border-color:var(--accent);background:var(--sky)}
.qt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.qt .t{margin:0 0 10px}
.pl{margin:8px 0 14px}
.pl p{margin:2px 0;font-size:.95rem}
@media (max-width:520px){.story{flex-direction:column-reverse}.story svg{flex-basis:auto}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<main>
  <section id="who" hidden>
    <h1>Qui joue?</h1>
    <p class="sub">Choisis ton personnage. Il garde tes étoiles et les questions à revoir.</p>
    <div class="menu" id="whoList"></div>
    <p><button class="back" id="parentLink2" type="button">Espace parents</button></p>
  </section>
  <section id="menu" hidden>
    <div class="me"><span id="meIcon"></span><b id="meName"></b><button class="back" id="chg" type="button">Changer de personnage</button></div>
    <h1>Wam Wam Utiti</h1>
    <p class="sub">Choisis une fiche. Les questions changent à chaque fois!</p>
    <div id="menuList"></div>
    <p><button class="back" id="parentLink" type="button">Espace parents</button></p>
  </section>
  <section id="sheet" hidden>
    <button class="back" id="back" type="button">← Retour au menu</button>
    <h1 id="title"></h1>
    <p class="sub" id="lvl"></p>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0" id="bar"><i id="fill"></i></div>
    <p class="count" id="count">0 sur 7</p>
    <h2 id="readHead">Lecture</h2>
    <div class="card story"><div><p id="story"></p><button class="spk" id="spkStory" type="button" hidden>🔊 Écouter l’histoire</button></div><div id="pic"></div></div>
    <div id="reading"></div>
    <h2 id="mathHead">Mathématique</h2>
    <div id="math"></div>
    <div class="card done" id="done" aria-live="polite">
      <h2 id="doneTitle">Bravo!</h2>
      <p class="stars" id="stars" aria-live="polite"></p>
      <p id="doneText"></p>
      <button class="again" id="retry" type="button" hidden>Revoir les questions ratées</button>
      <button class="again" id="again" type="button">Nouvelles questions</button>
      <button class="back" id="menu2" type="button">Retour au menu</button>
    </div>
  </section>
  <section id="gate" hidden>
    <button class="back" id="gateBack" type="button">← Retour</button>
    <h1>Espace parents</h1>
    <p class="sub" id="gateQ"></p>
    <div class="row"><input id="gateIn" type="text" inputmode="numeric" autocomplete="off" aria-label="Réponse"><button class="go" id="gateGo" type="button">Entrer</button></div>
    <p class="msg no" id="gateMsg" aria-live="polite"></p>
  </section>
  <section id="parent" hidden>
    <button class="back" id="parentBack" type="button">← Retour</button>
    <h1>Espace parents</h1>
    <p class="sub">Les résultats restent sur cet appareil. Rien n’est envoyé ailleurs.</p>
    <div id="parentList"></div>
    <p><button class="again alt" id="wipeAll" type="button">Tout effacer</button></p>
  </section>
</main>
<script>
function ri(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function R(q, a, w){ return {q:q, a:a, w:w}; }
function who(){var a=[['Léa','elle'],['Noah','il'],['Emma','elle'],['Zoé','elle'],['Adam','il'],['Mia','elle'],['Hugo','il'],['Jade','elle']][ri(0,7)];return {n:a[0],p:a[1],P:a[1].charAt(0).toUpperCase()+a[1].slice(1)};}
function storiesOf(sh){return [{text:sh.text,reading:sh.reading}].concat(sh.more||[]);}
function ad(){var t1=ri(1,4),t2=ri(1,4),u1=ri(1,8),u2=ri(1,9-u1);return [10*t1+u1,10*t2+u2];}
function sb(){var t1=ri(3,9),u1=ri(1,9),t2=ri(1,t1-1),u2=ri(0,u1);return [10*t1+u1,10*t2+u2];}
var SHEETS = [
 {id:"cabane", lvl:"3e année", title:"À la cabane à sucre", icon:"🍁", ready:true, label:'Une cabane à sucre avec un érable et un seau',
  svg:`<svg viewBox='0 0 150 150'><rect x='1' y='1' width='148' height='148' rx='10' fill='var(--sky)'/><path d='M2 118 Q40 104 75 114 T148 110 V147 H2Z' fill='#FFFFFF'/><rect x='62' y='72' width='64' height='44' fill='#B77B4A' stroke='#5C3D24' stroke-width='2'/><polygon points='55,74 94,45 133,74' fill='#8A4F2B' stroke='#5C3D24' stroke-width='2'/><rect x='108' y='50' width='9' height='18' fill='#9C6A44' stroke='#5C3D24' stroke-width='1.5'/><circle cx='113' cy='42' r='5' fill='#FFFFFF' opacity='.9'/><circle cx='119' cy='33' r='6' fill='#FFFFFF' opacity='.8'/><circle cx='113' cy='22' r='5' fill='#FFFFFF' opacity='.7'/><rect x='88' y='90' width='16' height='26' fill='#5C3D24'/><rect x='70' y='84' width='14' height='14' fill='#FFE8A3' stroke='#5C3D24' stroke-width='1.5'/><rect x='24' y='70' width='12' height='46' fill='#A9744F' stroke='#5C3D24' stroke-width='1.5'/><g stroke='#5C3D24' stroke-width='3' stroke-linecap='round'><line x1='30' y1='72' x2='13' y2='46'/><line x1='30' y1='72' x2='47' y2='44'/><line x1='30' y1='70' x2='30' y2='36'/></g><line x1='36' y1='88' x2='44' y2='92' stroke='#555555' stroke-width='3'/><circle cx='46' cy='96' r='2' fill='#6FB7E9'/><polygon points='38,100 56,100 54,116 40,116' fill='#C9D1D8' stroke='#4C5963' stroke-width='1.5'/></svg>`,
  text:"Chaque printemps, la famille de Léa visite la cabane à sucre de son oncle. Dans la forêt, il y a beaucoup d’érables. Son oncle perce un petit trou dans chaque arbre et y installe un seau. Goutte après goutte, l’eau d’érable coule dans le seau. Ensuite, on la fait bouillir dans un grand chaudron pour en faire du sirop. Léa adore le sirop, surtout sur une crêpe chaude!",
  reading:[
   R("À qui appartient la cabane à sucre?","À l’oncle de Léa",["À la grand-mère de Léa","À l’école de Léa"]),
   R("Où se trouvent les érables?","Dans la forêt",["Dans un jardin","Au bord d’un lac"]),
   R("Dans quoi coule l’eau d’érable?","Dans un seau",["Dans une bouteille","Dans une tasse"]),
   R("Que pense Léa du sirop d’érable?","Elle l’adore.",["Elle ne l’aime pas.","Elle le trouve trop chaud."]),
   R("Quand la famille de Léa visite-t-elle la cabane à sucre?","Au printemps",["En été","En hiver"]),
   R("Que fait l’oncle de Léa dans chaque arbre?","Il perce un petit trou et installe un seau.",["Il coupe l’arbre en morceaux.","Il plante une petite graine."]),
   R("Que fait-on avec l’eau d’érable pour obtenir du sirop?","On la fait bouillir dans un grand chaudron.",["On la met au congélateur.","On la mélange avec du lait froid."]),
   R("Qu’est-ce que Léa aime manger avec le sirop?","Une crêpe chaude",["Un sandwich","Une pizza"]),
   R("Que veut dire « goutte après goutte »?","Une goutte à la fois, lentement",["Toute l’eau tombe d’un coup","Il pleut beaucoup"]),
   R("Pourquoi l’oncle perce-t-il un trou dans l’arbre?","Pour laisser couler l’eau d’érable",["Pour cacher un trésor","Pour construire un nid"]),
   R("Vrai ou faux? La famille de Léa visite la cabane à l’automne.","Faux",["Vrai"]),
   R("Quel serait un bon titre pour cette histoire?","Une visite à la cabane à sucre",["Une journée à la plage","Le grand match de hockey"])
  ],
  more:[
   {text:'Samedi, Hugo et sa grand-mère visitent la cabane à sucre. Il y a encore un peu de neige dans la forêt, mais le soleil est chaud. Hugo aide à vider les seaux pleins d’eau d’érable dans un grand bidon. De la fumée blanche sort de la cheminée de la cabane. À l’intérieur, un cuisinier prépare une omelette et du jambon. Pour dessert, Hugo mange de la tarte au sucre. Il lèche ses doigts collants!',
    reading:[
     R('Qui visite la cabane à sucre avec Hugo?','Sa grand-mère',['Son grand-père','Sa tante']),
     R('Quel jour Hugo visite-t-il la cabane à sucre?','Samedi',['Mardi','Jeudi']),
     R('Que reste-t-il dans la forêt?','Un peu de neige',['Beaucoup de feuilles','Des fleurs']),
     R('Que fait Hugo avec les seaux pleins?','Il les vide dans un grand bidon.',['Il les lance en l’air.','Il les cache sous la neige.']),
     R('Que sort de la cheminée de la cabane?','De la fumée blanche',['Des étincelles rouges','Des ballons']),
     R('Qui prépare le repas à l’intérieur?','Un cuisinier',['Un pompier','Un facteur']),
     R('Que prépare le cuisinier?','Une omelette et du jambon',['Des spaghettis','Une soupe aux légumes']),
     R('Quel est le dessert de Hugo?','De la tarte au sucre',['De la crème glacée','Un gâteau au chocolat']),
     R('Pourquoi Hugo lèche-t-il ses doigts?','Ils sont collants.',['Ils sont froids.','Ils sont mouillés de pluie.']),
     R('Que veut dire « collants »?','Qui restent attachés quand on les touche',['Qui sont très froids','Qui sont très rapides']),
     R('Vrai ou faux? Hugo visite la cabane à sucre en été.','Faux',['Vrai']),
     R('Quel titre conviendrait le mieux à l’histoire de Hugo?','Un samedi sucré à la cabane',['Une soirée au cinéma','Un match de soccer'])
    ]},
   {text:'Mathis visite la cabane à sucre avec sa classe. L’autobus roule sur un chemin de terre entre les grands arbres. Un guide montre aux élèves comment couler la tire d’érable sur la neige propre. Chaque élève reçoit un bâtonnet pour l’enrouler. Mathis trouve que la tire est un peu trop sucrée! Avant de partir, la classe fait une photo devant la cabane.',
    reading:[
     R('Avec qui Mathis visite-t-il la cabane à sucre?','Avec sa classe',['Avec sa famille','Avec son équipe de hockey']),
     R('Comment les élèves se rendent-ils à la cabane?','En autobus',['En train','En bateau']),
     R('Sur quel genre de chemin l’autobus roule-t-il?','Un chemin de terre',['Une autoroute','Un chemin de glace']),
     R('Qui montre aux élèves comment couler la tire?','Un guide',['Le directeur','Le conducteur']),
     R('Où coule-t-on la tire d’érable?','Sur la neige propre',['Dans un grand verre','Sur du pain grillé']),
     R('Que reçoit chaque élève?','Un bâtonnet',['Une fourchette','Une cuillère']),
     R('Que fait-on avec le bâtonnet?','On enroule la tire dessus.',['On le plante dans un arbre.','On le lance dans la forêt.']),
     R('Que pense Mathis de la tire d’érable?','Elle est un peu trop sucrée.',['Elle n’a aucun goût.','Elle est trop salée.']),
     R('Que fait la classe avant de partir?','Une photo devant la cabane',['Un match de soccer','Une chanson dans l’autobus']),
     R('Que veut dire « enrouler »?','Tourner autour de quelque chose',['Casser en petits morceaux','Jeter par terre']),
     R('Vrai ou faux? Mathis visite la cabane avec sa famille.','Faux',['Vrai']),
     R('Quel titre conviendrait le mieux à l’histoire de Mathis?','Une sortie de classe à la cabane à sucre',['Une journée à la plage','Un voyage dans l’espace'])
    ]}
  ],
  math:[
   function(){var r=ri(2,6),t=ri(3,8);return {q:'Dans la forêt, il y a '+r+' rangées de '+t+' érables. Combien y a-t-il d’érables en tout?',a:r*t,hint:'Essaie d’additionner : '+Array(r).fill(t).join(' + ')+'.'};},
   function(){var w=who(),a=ri(21,59),b=ri(15,38);return {q:w.n+' aide à installer des seaux. Le matin, '+w.p+' en installe '+a+'. L’après-midi, '+w.p+' en installe '+b+'. Combien de seaux a-t-'+w.p+' installés en tout?',a:a+b,hint:'Additionne d’abord les unités ('+a%10+' + '+b%10+'), puis les dizaines.'};},
   function(){var w=who(),it=['crêpes','biscuits','bonbons à l’érable','tranches de pain','saucisses'][ri(0,4)],a=ri(10,18),b=ri(3,9);return {q:w.n+' a '+a+' '+it+'. '+w.P+' en mange '+b+'. Combien de '+it+' lui reste-t-il?',a:a-b,hint:'Enlève '+b+' de '+a+'.'};},
   function(){var t=ri(3,7),p=ri(4,8),v=ri(0,2);var q=v===0?'À la cabane, il y a '+t+' tables. Il y a '+p+' personnes autour de chaque table. Combien y a-t-il de personnes en tout?':(v===1?'Il y a '+t+' bancs. Il y a '+p+' enfants sur chaque banc. Combien y a-t-il d’enfants en tout?':'Il y a '+t+' chaudrons. Chaque chaudron contient '+p+' litres de sirop. Combien y a-t-il de litres en tout?');return {q:q,a:t*p,hint:'Essaie d’additionner : '+Array(t).fill(p).join(' + ')+'.'};},
   function(){var a=ri(30,59),b=ri(21,39),v=ri(0,1);return {q:v?'L’érablière a produit '+a+' litres de sirop lundi et '+b+' litres mardi. Combien de litres a-t-elle produits en tout?':'On a récolté '+a+' litres d’eau d’érable le matin et '+b+' litres l’après-midi. Combien de litres a-t-on récoltés en tout?',a:a+b,hint:'Additionne d’abord les unités ('+a%10+' + '+b%10+'), puis les dizaines.'};},
   function(){var c=['bidon','baril','chaudron'][ri(0,2)],a=ri(51,95),b=ri(12,39);return {q:'Le '+c+' contient '+a+' litres d’eau d’érable. On en verse '+b+' litres dans des bouteilles. Combien de litres reste-t-il dans le '+c+'?',a:a-b,hint:'Enlève d’abord les dizaines, puis les unités.'};},
   function(){var a=ri(12,45),b=ri(8,36);return {q:'Il y a '+a+' pots de sirop sur une étagère et '+b+' pots sur une autre. Combien y a-t-il de pots en tout?',a:a+b,hint:'Additionne les dizaines, puis les unités.'};},
   function(){var p=ri(5,9),n=ri(2,4);return {q:'Un pot de sirop coûte '+p+' $. On en achète '+n+'. Combien faut-il payer en tout?',a:p*n,hint:'Essaie d’additionner : '+Array(n).fill(p).join(' + ')+'.'};},
   function(){var a=ri(120,360),b=ri(110,290);return {q:'En mars, la cabane produit '+a+' litres de sirop. En avril, elle en produit '+b+'. Combien de litres de sirop produit-elle en tout?',a:a+b,hint:'Additionne les unités, puis les dizaines, puis les centaines.'};},
   function(){var n=ri(2,5),p=ri(3,8);return {q:'On remplit '+n+' paniers de tire d’érable. Chaque panier contient '+p+' morceaux. Combien y a-t-il de morceaux en tout?',a:n*p,hint:'Essaie d’additionner : '+Array(n).fill(p).join(' + ')+'.'};},
   function(){var a=ri(21,49),b=ri(15,38);return {q:'Lundi, on entaille '+a+' arbres. Mardi, on en entaille '+b+'. Combien d’arbres a-t-on entaillés en tout?',a:a+b,hint:'Additionne d’abord les unités ('+a%10+' + '+b%10+'), puis les dizaines.'};},
   function(){var a=ri(40,90),b=ri(12,35);return {q:'Il y a '+a+' érables dans le boisé. Il y a '+b+' érables qui n’ont pas encore de seau. Combien d’érables ont un seau?',a:a-b,hint:'Enlève d’abord les dizaines, puis les unités.'};}
  ],

  rd.innerHTML = ""; mh.innerHTML = ""; round = items; isRetry = retry; TOTAL = items.length;
  answered = 0; firstTry = 0; missed = []; $("done").classList.remove("show");
  $("title").textContent = cur.title; $("lvl").textContent = (retry ? "Questions à revoir · " : "Lecture et mathématique · ") + cur.lvl; var first = items.filter(function(d){ return d.kind === "r"; })[0], st = first ? first.story : storiesOf(cur)[0];
  $("story").textContent = st.text; var spk = $("spkStory"); spk.hidden = !SPEECH; spk.onclick = function(){ speak(st.text, spk); }; document.querySelector(".card.story").style.display = first ? "" : "none";
  $("pic").innerHTML = cur.svg.replace("<svg ", '<svg role="img" aria-label="' + cur.label + '" ');
  var nr = 0, nm = 0, n = 0;
  items.forEach(function(d){ if (d.kind === "r") nr++; else nm++; });
  $("readHead").hidden = nr === 0; $("mathHead").hidden = nm === 0;
  items.forEach(function(d){
    used[d.key] = 1; n++;
    if (d.kind === "r") rd.appendChild(readingCard(d, n)); else mh.appendChild(mathCard(d, n));
  });
  progress();
}
function readingCard(d, n){
  var item = d.item, box = el("div", "card q"), wrong = false, grid = null;
  box.appendChild(qTitle(n, item.q, function(){ var t = item.q; if (grid) Array.prototype.forEach.call(grid.children, function(b){ t += ". " + b.textContent; }); return t; }));
  grid = el("div", "choices"); var msg = el("p", "msg"); msg.setAttribute("aria-live", "polite");
  shuffle([item.a].concat(item.w)).forEach(function(txt){
    var b = el("button", "choice", txt); b.type = "button";
    b.addEventListener("click", function(){
      if (txt === item.a) {
        b.classList.add("ok");
        Array.prototype.forEach.call(grid.children, function(c){ c.disabled = true; });
        msg.className = "msg ok"; msg.textContent = "Bravo! C’est la bonne réponse.";
        finish(d, !wrong);
      } else {
        wrong = true; b.classList.add("no"); b.disabled = true;
        msg.className = "msg no"; msg.textContent = "Pas tout à fait. Relis l’histoire et essaie encore!";
      }
    });
    grid.appendChild(b);
  });
  box.appendChild(grid); box.appendChild(msg);
  return box;
}
function mathCard(d, n){
  var item = d.gen(), tries = 0, box = el("div", "card q");
  box.appendChild(qTitle(n, item.q, function(){ return item.q; }));
  var row = el("div", "row"), inp = el("input"), btn = el("button", "go", "Vérifier");
  inp.type = "text"; inp.inputMode = "numeric"; inp.autocomplete = "off"; inp.setAttribute("aria-label", "Ta réponse à la question " + n);
  btn.type = "button";
  var msg = el("p", "msg"), hint = el("p", "hint"); msg.setAttribute("aria-live", "polite");
  function check(){
    if (inp.disabled) return;
    var v = inp.value.replace(/\s/g, "");
    if (v === "") { msg.className = "msg no"; msg.textContent = "Écris ta réponse d’abord."; return; }
    if (Number(v) === item.a) {
      inp.disabled = true; btn.disabled = true; msg.className = "msg ok"; msg.textContent = "Bravo! " + item.a + ", c’est exact.";
      hint.textContent = ""; finish(d, tries === 0);
    } else {
      tries++; msg.className = "msg no"; msg.textContent = "Pas encore. Essaie encore!";
      if (tries >= 2) hint.textContent = "Indice : " + item.hint;
      inp.select();
    }
  }
  btn.addEventListener("click", check);
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") check(); });
  row.appendChild(inp); row.appendChild(btn);
  box.appendChild(row); box.appendChild(msg); box.appendChild(hint);
  return box;
}
